<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, Helvetica, sans-serif">
  <title id="title">Stock 시스템 구조</title>
  <desc id="desc">수집: 시세 공급원에서 수집 프로세스를 거쳐 원본 저장소에 저장하고 종료 후 검사기가 검사하며 보관 저장소에 사본을 둡니다. 연구: 매일 준비 작업이 연구 입력을 만들고 틱 재생기와 전략 모듈을 거쳐 결과 저장소에 기록합니다. 2026-11-01 기준 채택된 후보는 없습니다. 운영 반영, 원본 읽기, 재처리는 사람 승인 뒤에만 진행합니다. 모의매매: 연결 시험 준비 단계이며 전체 경로는 미완료입니다. 실거래는 하지 않습니다.</desc>
