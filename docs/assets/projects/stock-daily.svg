<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, Helvetica, sans-serif">
  <title id="title">Stock 하루 운영 흐름</title>
  <desc id="desc">개장 전에는 사람이 목록과 거래일을 확인하고 수집을 시작합니다. 장중에는 수집 프로세스가 원본을 저장합니다. 20시 정상 종료 뒤 종료 후 검사, 평일 야간 매일 준비 작업, 사본과 해시 대조가 자동으로 진행되고 사람이 결과를 확인하고 승인 여부를 판단합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356A86"/></marker></defs>
  <rect width="1200" height="800" fill="#FBF8F0"/>
  <text x="60" y="66" fill="#304750" font-size="34" font-weight="700" text-anchor="start">하루 운영 흐름</text>
  <text x="60" y="106" fill="#61727A" font-size="23" font-weight="400" text-anchor="start">시작은 사람이, 마감 뒤 검사와 준비는 자동으로 진행합니다</text>
  <text x="60" y="160" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">개장 전 · 사람</text>
  <path d="M60 172H1140" stroke="#D7DCD9" stroke-width="1.5" fill="none"/>
  <g class="node">
  <rect x="60" y="186" width="1080" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="600.0" y="228.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">공식 목록 가져오기 → 목록·거래일 확인 → 준비 확인 → 수집 시작</text>
  <text x="600.0" y="259.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">시작은 예약 작업이 아니라 사람이 합니다 (로그인 포함)</text>
  </g>
  <path d="M600 286L600 340" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="60" y="330" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">장중 08:00~20:00 · 자동</text>
  <path d="M60 342H1140" stroke="#D7DCD9" stroke-width="1.5" fill="none"/>
  <g class="node">
  <rect x="60" y="356" width="1080" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="600.0" y="398.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">수집 프로세스가 원본 저장</text>
  <text x="600.0" y="429.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">무거운 계산·테스트는 1CPU·2GiB 제한 실행기로만, 연구 작업은 수집기에 손대지 않음</text>
  </g>
  <path d="M600 456L600 510" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="60" y="500" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">장 마감 후 · 자동</text>
  <path d="M60 512H1140" stroke="#D7DCD9" stroke-width="1.5" fill="none"/>
  <g class="node">
  <rect x="60" y="526" width="240" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="180.0" y="568.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">정상 종료</text>
  <text x="180.0" y="599.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">20:00:30</text>
  </g>
  <g class="node">
  <rect x="340" y="526" width="240" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="460.0" y="568.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">종료 후 검사</text>
  <text x="460.0" y="599.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">하루 한 번 자동 시작</text>
  </g>
  <g class="node">
  <rect x="620" y="526" width="240" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="740.0" y="568.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">매일 준비 작업</text>
  <text x="740.0" y="599.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">평일 야간 예약</text>
  </g>
  <g class="node">
  <rect x="900" y="526" width="240" height="100" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="1020.0" y="568.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">사본·해시 대조</text>
  <text x="1020.0" y="599.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">보조 디스크</text>
  </g>
  <path d="M300 576L338 576" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M580 576L618 576" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 576L898 576" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 626L600 680" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="60" y="670" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">장 마감 후 · 사람</text>
  <path d="M60 682H1140" stroke="#D7DCD9" stroke-width="1.5" fill="none"/>
  <g class="node">
  <rect x="60" y="696" width="1080" height="84" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="600.0" y="745.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">검사 결과 확인 · 승인 카드 판단</text>
  </g>
</svg>
