<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, Helvetica, sans-serif">
  <title id="title">AI TOP 100 예선 과제 구조</title>
  <desc id="desc">수집 자료와 자체 전송 도구로 모은 대화를 정제·검산 스크립트로 다듬어 행마다 출처가 있는 사실 원장을 만들고, 프롬프트 생성과 배포 스크립트를 거쳐 로컬 봇 서버에 올립니다. 일괄 시험 결과는 사실 원장으로 되돌립니다. 봇 서버는 메신저 채널, LLM 1차·예비, 외부 업무 서버와 연결되고 watchdog이 자동으로 재시작합니다. 공식 점수는 안내되지 않고 대회 문제 내용은 공개하지 않습니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356A86"/></marker></defs>
