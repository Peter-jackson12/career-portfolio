<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, Helvetica, sans-serif">
  <title id="title">Stock 데이터 흐름과 실패 처리</title>
  <desc id="desc">수집, 저장, 원본 검사, 연구 입력 준비, 재생과 백테스트, 판정의 여섯 단계와 각 단계가 어긋났을 때의 동작을 나란히 보여 줍니다. 저장 검사 통과가 다음 단계의 자동 승인은 아니며 검사는 시장 coverage, 연구 적격성, 수익성을 인증하지 않습니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356A86"/></marker></defs>
  <rect width="1200" height="1100" fill="#FBF8F0"/>
  <text x="60" y="66" fill="#304750" font-size="34" font-weight="700" text-anchor="start">데이터 흐름과 실패 처리</text>
  <text x="60" y="106" fill="#61727A" font-size="23" font-weight="400" text-anchor="start">각 단계가 어긋났을 때 어떻게 멈추거나 기록하는지를 함께 정했습니다</text>
  <text x="60" y="160" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">단계</text>
  <text x="650" y="160" fill="#356A86" font-size="23" font-weight="700" text-anchor="start">어긋나면</text>
  <g class="node">
  <rect x="60" y="180" width="530" height="148" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="246.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">수집</text>
  <text x="325.0" y="277.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">실시간 체결·호가 → 날짜별 원본 이벤트</text>
  </g>
  <g class="node">
  <rect x="650" y="180" width="490" height="148" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="216.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">큐가 넘치면 해당 조각만 버리고 계수</text>
  <text x="895.0" y="247.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">기록상 버림 0, 일중 최대 사용 41~732 / 65,536</text>
  <text x="895.0" y="278.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">수집 기록이 실패로 남으면 다음 날 시작이 막히고</text>
  <text x="895.0" y="309.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">사람 승인으로 해제</text>
  </g>
  <path d="M590 254.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M325 328L325 344" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="346" width="530" height="118" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="397.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">저장</text>
  <text x="325.0" y="428.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">큐의 이벤트 → 원본 저장소의 날짜별 파일</text>
  </g>
  <g class="node">
  <rect x="650" y="346" width="490" height="118" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="397.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">장중 전원이 꺼지면 세션이 둘로 나뉘고</text>
  <text x="895.0" y="428.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">검사를 건너뛴 뒤 사람이 정리</text>
  </g>
  <path d="M590 405.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M325 464L325 480" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="482" width="530" height="118" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="518.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">원본 검사</text>
  <text x="325.0" y="549.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">정상 종료한 날의 순번·JSON·파일 끝</text>
  <text x="325.0" y="580.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">체크섬·콜백 회계 대조</text>
  </g>
  <g class="node">
  <rect x="650" y="482" width="490" height="118" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="533.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">자동 시작이 실패하면</text>
  <text x="895.0" y="564.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">사람 판정 경로로 검사</text>
  </g>
  <path d="M590 541.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M325 600L325 616" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="618" width="530" height="118" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="669.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">연구 입력 준비</text>
  <text x="325.0" y="700.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">검사가 끝난 날짜 → 가공 입력 + 영수증</text>
  </g>
  <g class="node">
  <rect x="650" y="618" width="490" height="118" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="684.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">차단 판정이면 복구 절차를 기다림</text>
  </g>
  <path d="M590 677.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M325 736L325 752" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="754" width="530" height="118" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="790.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">재생·백테스트</text>
  <text x="325.0" y="821.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">연구 입력 + 규칙 →</text>
  <text x="325.0" y="852.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">신호·주문·체결·거래·자본 곡선</text>
  </g>
  <g class="node">
  <rect x="650" y="754" width="490" height="118" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="805.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">수신 시각 역행이 있는 날은</text>
  <text x="895.0" y="836.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">재생 단계 검사가 실패할 수 있음</text>
  </g>
  <path d="M590 813.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M325 872L325 888" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="890" width="530" height="118" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="325.0" y="941.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">판정</text>
  <text x="325.0" y="972.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">사전등록 기준 + 비용 규칙 → 후보 여부</text>
  </g>
  <g class="node">
  <rect x="650" y="890" width="490" height="118" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="895.0" y="956.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">결과를 보고 규칙을 바꾸지 않음</text>
  </g>
  <path d="M590 949.0H648" stroke="#356A86" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="60" y="1050" fill="#61727A" font-size="21" font-weight="400" text-anchor="start">저장 검사 통과가 다음 연구 단계의 자동 승인은 아닙니다.</text>
  <text x="60" y="1080" fill="#61727A" font-size="21" font-weight="400" text-anchor="start">검사는 시장 coverage·연구 적격성·수익성을 인증하지 않습니다.</text>
</svg>
