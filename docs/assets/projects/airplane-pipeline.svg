<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, Helvetica, sans-serif">
  <title id="title">Airplane 분석 구조</title>
  <desc id="desc">원본 항공편 1,000,000행에서 두 질문을 나눕니다. 질문 1은 라벨 255,001행에서 전처리를 비교해 행 순서 의존을 27,536행에서 0행으로 없앴지만 Macro F1 향상은 확인하지 못했습니다. 질문 2는 BTS 자료로 706,759행의 날짜를 확인하고 날씨 14개 피처를 결합해 동일 180,332행에서 비교했으며 Macro F1이 0.574에서 0.599로 세 시드 모두 개선됐습니다. 두 평가 집단은 서로 다르고 정적 교차검증 결과입니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#356A86"/></marker></defs>
  <rect width="1200" height="1240" fill="#FBF8F0"/>
  <text x="60" y="66" fill="#304750" font-size="34" font-weight="700" text-anchor="start">Airplane 분석 구조</text>
  <text x="60" y="106" fill="#61727A" font-size="23" font-weight="400" text-anchor="start">두 질문을 서로 다른 평가 집단에서 따로 검증합니다</text>
  <g class="node">
  <rect x="60" y="140" width="1080" height="96" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="600.0" y="180.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">원본 항공편 데이터</text>
  <text x="600.0" y="211.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">1,000,000행 · 19열 · 타깃 결측은 미라벨로 취급</text>
  </g>
  <path d="M520.0 236V277.0H320.0V318" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M680.0 236V277.0H880.0V318" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="320" width="520" height="62" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="320.0" y="358.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">질문 1 · 전처리를 고치면 오르는가</text>
  </g>
  <g class="node">
  <rect x="620" y="320" width="520" height="62" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="880.0" y="358.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">질문 2 · 날씨를 더하면 오르는가</text>
  </g>
  <path d="M320.0 382L320.0 418" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M880.0 382L880.0 418" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="420" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="320.0" y="459.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">의미 보존 전처리</text>
  <text x="320.0" y="490.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">대응이 유일한 키만 채우고</text>
  <text x="320.0" y="521.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">미상 시각은 결측 플래그로 보존</text>
  </g>
  <g class="node">
  <rect x="620" y="420" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="880.0" y="459.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">날짜 귀속</text>
  <text x="880.0" y="490.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">BTS 운항 자료로 연도가 하나로</text>
  <text x="880.0" y="521.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">확정되는 706,759행만 채택</text>
  </g>
  <path d="M880.0 544L880.0 580" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="620" y="582" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="880.0" y="621.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">날씨 결합</text>
  <text x="880.0" y="652.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">공항 관측 날씨 14개 피처</text>
  <text x="880.0" y="683.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">예측 시점 이후 관측은 제외</text>
  </g>
  <path d="M320.0 544L320.0 742" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M880.0 706L880.0 742" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="744" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="320.0" y="783.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">평가 집단 A</text>
  <text x="320.0" y="814.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">라벨 255,001행</text>
  <text x="320.0" y="845.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">10조건 × 3시드 × 5-fold</text>
  </g>
  <g class="node">
  <rect x="620" y="744" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="880.0" y="783.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">평가 집단 B</text>
  <text x="880.0" y="814.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">동일 180,332행 · 동일 폴드</text>
  <text x="880.0" y="845.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">3시드 쌍비교</text>
  </g>
  <path d="M320.0 868L320.0 904" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M880.0 868L880.0 904" stroke="#356A86" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g class="node">
  <rect x="60" y="906" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="320.0" y="945.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">결과</text>
  <text x="320.0" y="976.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">행 순서 의존 27,536행 → 0행</text>
  <text x="320.0" y="1007.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">Macro F1 향상은 확인하지 못함</text>
  </g>
  <g class="node">
  <rect x="620" y="906" width="520" height="124" rx="4" fill="#FFFFFF" stroke="#356A86" stroke-width="2.5"/>
  <text x="880.0" y="945.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">결과</text>
  <text x="880.0" y="976.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">Macro F1 0.574 → 0.599</text>
  <text x="880.0" y="1007.0" fill="#304750" font-size="21" font-weight="400" text-anchor="middle">세 시드·세 지표 모두 개선</text>
  </g>
  <g class="node">
  <rect x="60" y="1062" width="1080" height="96" rx="4" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
  <text x="600.0" y="1102.0" fill="#304750" font-size="24" font-weight="700" text-anchor="middle">공통 평가 경계</text>
  <text x="600.0" y="1133.0" fill="#61727A" font-size="21" font-weight="400" text-anchor="middle">내부 검증으로 트리 수·임계값을 고르고, 외부 폴드는 채점에만 사용</text>
  </g>
  <text x="60" y="1194" fill="#61727A" font-size="21" font-weight="400" text-anchor="start">두 평가 집단은 서로 다르므로 결과를 이어서 읽지 않습니다.</text>
  <text x="60" y="1224" fill="#61727A" font-size="21" font-weight="400" text-anchor="start">정적 교차검증 결과이며 인과 효과나 미래 운항 성능을 뜻하지 않습니다.</text>
</svg>
