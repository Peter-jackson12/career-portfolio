name: Ownership review snapshot
on:
  push:
    branches: [review/ownership-snapshot-20260922]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1d811f8c02f38d59dc75a48ef7f15977360ea79c
          persist-credentials: false
          fetch-depth: 0
      - name: Archive tracked code only
        run: |
          git archive --format=zip --output=head.zip HEAD
          git archive --format=zip --output=base.zip 3eded45c1ef1be2b807c34244b99597b79995c15
          git diff 3eded45c1ef1be2b807c34244b99597b79995c15 HEAD > changes.patch
          git ls-tree -r HEAD > tree.txt
          git rev-parse HEAD HEAD^{tree} > revision.txt
          git log --format='%H %s' 3eded45c1ef1be2b807c34244b99597b79995c15..HEAD > commits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-source-portfolio
          path: |
            head.zip
            base.zip
            changes.patch
            tree.txt
            revision.txt
            commits.txt
          retention-days: 1
